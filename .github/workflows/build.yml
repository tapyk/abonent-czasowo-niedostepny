name: Build

# Builds every push. On main, when VERSION holds a version higher than the
# newest v* tag, also publishes a GitHub release with the built files.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  PROJECT_DIR: game
  EXE_NAME: AbonentNiedostepny

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: v
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=VERSION::VERSION must look like MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi
          # Android versionCode must grow with every release.
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))

          LATEST="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          RELEASE=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$LATEST" ]; then
              RELEASE=true
            fi
          fi
          echo "VERSION=$VERSION  versionCode=$CODE  latest tag=${LATEST:-none}  release=$RELEASE"
          {
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

  export:
    name: ${{ matrix.preset }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows
            dir: windows
            ext: exe
          - preset: Linux
            dir: linux
            ext: x86_64
          - preset: macOS
            dir: macos
            ext: zip
          - preset: Android
            dir: android
            ext: apk
    env:
      # Build file name: <name>-<version>.<ext>, e.g. AbonentNiedostepny-0.1.1.apk
      FILE: AbonentNiedostepny-${{ needs.version.outputs.version }}.${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i -E \
            -e "s#^(application/(file_version|product_version|short_version|version))=.*#\1=\"$VERSION\"#" \
            -e "s#^version/name=.*#version/name=\"$VERSION\"#" \
            -e "s#^version/code=.*#version/code=$CODE#" \
            "$PROJECT_DIR/export_presets.cfg"
          sed -i '/^config\/version=/d' "$PROJECT_DIR/project.godot"
          sed -i "/^\[application\]/a config/version=\"$VERSION\"" "$PROJECT_DIR/project.godot"
          grep -n 'version' "$PROJECT_DIR/export_presets.cfg" "$PROJECT_DIR/project.godot"

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          mkdir -p ~/godot-dl
          curl -fL --retry 3 -o ~/godot-dl/godot.zip "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          curl -fL --retry 3 -o ~/godot-dl/templates.tpz "${BASE}/Godot_v${TAG}_export_templates.tpz"

      - name: Install Godot + export templates
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-bin
          unzip -q -o ~/godot-dl/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${TAG}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL_DIR"
          # Unpack only the templates this platform needs (the .tpz is ~1.3 GB).
          case "${{ matrix.dir }}" in
            windows) PATTERN='templates/windows_*_x86_64.exe' ;;
            linux)   PATTERN='templates/linux_*.x86_64' ;;
            macos)   PATTERN='templates/macos.zip' ;;
            android) PATTERN='templates/android_*.apk' ;;
          esac
          unzip -q -o -j ~/godot-dl/templates.tpz 'templates/version.txt' "$PATTERN" -d "$TPL_DIR"
          ls -la "$TPL_DIR"

      - name: Set up Java (Android)
        if: matrix.dir == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK + keystore
        if: matrix.dir == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS_DIR=~/keystores
          mkdir -p "$KS_DIR"
          keytool -genkeypair -v -keystore "$KS_DIR/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$KS_DIR/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS_DIR/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

          # Optional release signing: set the ANDROID_KEYSTORE_* repo secrets
          # to get a release APK; otherwise a debug-signed APK is built.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_DIR/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS_DIR/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEYSTORE_USER"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "EXPORT_MODE=release"
            } >> "$GITHUB_ENV"
          else
            echo "EXPORT_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import

      - name: Export ${{ matrix.preset }}
        run: |
          set -euo pipefail
          OUT="export/${{ matrix.dir }}/$FILE"
          mkdir -p "$(dirname "$OUT")"
          MODE="${EXPORT_MODE:-release}"
          godot --headless --path "$PROJECT_DIR" --export-$MODE "${{ matrix.preset }}" "../$OUT"
          test -s "$OUT" || { echo "::error::Export produced no file at $OUT"; exit 1; }
          ls -la "export/${{ matrix.dir }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}-${{ matrix.dir }}
          path: export/${{ matrix.dir }}/${{ env.FILE }}
          if-no-files-found: error

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, export]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.EXE_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Abonent Niedostępny $VERSION" \
            --generate-notes
